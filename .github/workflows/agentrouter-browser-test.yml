name: AgentRouter Browser Test

on:
  push:
    branches:
      - debug/agentrouter-browser-405

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "latest"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: uv sync --frozen
      - run: uv run pytest tests/test_agentrouter_browser.py -q
